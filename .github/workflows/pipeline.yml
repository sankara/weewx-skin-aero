name: Pipeline
on:
  push:
    branches: [ trunk ]
    tags: [ "v*" ]
  pull_request:
    branches: [ trunk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "skins/Aero/package-lock.json"

      - name: Install Python dependencies
        run: uv sync

      - name: Install JS dependencies
        run: npm ci
        working-directory: skins/Aero

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run Python tests (Pytest)
        run: uv run pytest

      - name: Run JS tests (Vitest)
        run: npx vitest run
        working-directory: skins/Aero

      - name: Get Version
        if: github.event_name != 'pull_request'
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
          else
            # Generate version: yy-wk.hash
            YEAR=$(date +'%y')
            WEEK=$(date +'%V')
            HASH=$(git rev-parse --short HEAD)
            echo "VERSION=${YEAR}-${WEEK}.${HASH}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Skin Archive
        if: github.event_name != 'pull_request'
        id: package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Run package tool from root directory.
          uv run aero-package --version "$VERSION" --output-dir "dist"
          echo "asset_name=weewx-aero-${VERSION}.zip" >> $GITHUB_OUTPUT

      # 1. TRUNK RELEASE (Rolling)
      - name: Update Trunk Release
        if: github.event_name != 'pull_request' && steps.version.outputs.IS_RELEASE == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Aero Skin - Latest
          body: "Rolling release of the latest development version."
          allowUpdates: true
          prerelease: true
          artifacts: dist/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          removeArtifacts: true

      # 2. VERSIONED RELEASE (Tags)
      - name: Create Versioned Release
        if: github.event_name != 'pull_request' && steps.version.outputs.IS_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.VERSION }}
          name: Aero Skin ${{ steps.version.outputs.VERSION }}
          body: "Release of Aero Skin version ${{ steps.version.outputs.VERSION }}."
          artifacts: dist/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
