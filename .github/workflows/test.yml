name: Test

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: "skins/Aero/package-lock.json"

    - name: Install JS dependencies
      run: npm ci
      working-directory: skins/Aero

    - name: Install Playwright browsers
      run: uv run playwright install --with-deps chromium

    - name: Run Python tests (Pytest + Playwright)
      run: uv run pytest

    - name: Run JS tests (Vitest)
      run: npx vitest run
      working-directory: skins/Aero
