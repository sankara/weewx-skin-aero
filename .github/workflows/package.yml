name: Build and Release Aero Skin

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION=trunk" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Skin Archive
        run: |
          # Aero Skin - weewx-aero-{version}.zip
          VERSION=${{ steps.version.outputs.VERSION }}
          FILENAME="weewx-aero-${VERSION}.zip"
          
          # Create a staging directory 'aero' (this will be the root in the zip)
          mkdir -p aero
          
          # Copy essential files
          cp skin.conf index.html style.css app.js LICENSE README.md VERSION aero/
          cp *.tmpl aero/
          
          # Copy icons if they exist
          if [ -d "icons" ]; then cp -r icons aero/; fi
          
          # Zip the folder
          zip -r $FILENAME aero
          
          echo "ASSET_NAME=$FILENAME" >> $GITHUB_ENV

      # 1. TRUNK RELEASE (Rolling)
      - name: Update Trunk Release
        if: steps.version.outputs.IS_RELEASE == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: trunk
          name: Aero Skin - Trunk
          body: "Rolling release of the latest development version."
          allowUpdates: true
          prerelease: true
          artifacts: ${{ env.ASSET_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          removeArtifacts: true

      # 2. VERSIONED RELEASE (Tags)
      - name: Create Versioned Release
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.VERSION }}
          name: Aero Skin ${{ steps.version.outputs.VERSION }}
          body: "Release of Aero Skin version ${{ steps.version.outputs.VERSION }}."
          artifacts: ${{ env.ASSET_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

