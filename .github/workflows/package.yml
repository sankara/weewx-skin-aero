name: Build and Release Aero Skin

on:
  push:
    branches: [ "trunk" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: dev
        run: uv sync

      - name: Install Playwright browsers
        working-directory: dev
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        working-directory: dev
        run: uv run pytest

      - name: Get Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
          else
            # Generate version: yy-wk.hash
            YEAR=$(date +'%y')
            WEEK=$(date +'%V')
            HASH=$(git rev-parse --short HEAD)
            echo "VERSION=${YEAR}-${WEEK}.${HASH}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Skin Archive
        id: package
        working-directory: dev
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Run package tool from dev directory, outputting to ../dist relative to dev (so repo root/dist)
          uv run aero-package --version "$VERSION" --output-dir "../dist"
          echo "asset_name=weewx-aero-${VERSION}.zip" >> $GITHUB_OUTPUT

      # 1. TRUNK RELEASE (Rolling)
      - name: Update Trunk Release
        if: steps.version.outputs.IS_RELEASE == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: trunk
          name: Aero Skin - Trunk
          body: "Rolling release of the latest development version."
          allowUpdates: true
          prerelease: true
          artifacts: dist/${{ steps.package.outputs.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          removeArtifacts: true

      # 2. VERSIONED RELEASE (Tags)
      - name: Create Versioned Release
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.VERSION }}
          name: Aero Skin ${{ steps.version.outputs.VERSION }}
          body: "Release of Aero Skin version ${{ steps.version.outputs.VERSION }}."
          artifacts: dist/${{ steps.package.outputs.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
