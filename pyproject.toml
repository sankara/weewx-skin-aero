[project]
name = "aero-dev"
version = "2.3.2"
description = "Development tooling for the Aero WeeWX skin"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "weewx==5.1.0",
    "playwright>=1.40.0",
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "pytest-xdist>=3.0.0",
    "pywebpack>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
aero-gen = "aero_dev.data_generator:main"
aero-build = "aero_dev.report_builder:main"
aero-package = "aero_dev.packaging:main"
aero-version = "aero_dev.versioning:main"
aero-screenshots = "aero_dev.screenshots:main"
aero-dev = "aero_dev.watch:main"
aero-test = "aero_dev.test_runner:main"
aero-clean = "aero_dev.clean:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aero_dev"]
